<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECT</title>
    <link rel= "icon" href="files/icons/anemone-flower.svg" type="image/svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- BACKGROUND CLIP -->
    <video preload autoplay loop muted>
        <source src="files/img/swished-redirect-bg2.mp4">
    </video>

    <!-- AUDIO -->
    <audio controls autoplay loop src="files/audio/anemone-page-2-zahere.wav"></audio>
    
    <!-- DLC HEBREW BACKGROUND ANIMATION -->
    <img class="dlc-hebrew-bg" src="files/img/dlc-bg_5s.gif" alt="dlc-hebrew-bg-gif">

    <!-- DLC LOGO ON ROTATION -->
    <img class="dlc-logo" src="files/icons/dlc-logo.gif" alt="dlc-logo-gif">

    <div class="container">
        <!-- HANDS CARRYING THE LINKS -->
        <div class="carried-links">

            <!-- LEFT HAND & SOUNDCLOUND REDIRECT LINK -->
            <div class="c-left-hand">

                <img class="left-hand" src="files/icons/ezek-open-left-hand.svg" alt="left-hand">
                <a class="soundcloud" href="https://on.soundcloud.com/iDfMOHfDsU0Mt0cDDH" target="_blank"></a>
            </div>

            <!-- RIGHT HAND & YOUTUBE REDIRECT LINK-->
            <div class="c-right-hand">

                <img class="right-hand" src="files/icons/ezek-right-open-hand.svg" alt="right-hand">
                <a class="youtube" href="https://youtu.be/Q508yHKIccs" target="_blank"></a>
            </div>
        </div>

        <!-- CLOUD -->
        <div class="cloud"></div>
    </div>

    <script src="anim.js"></script>
</body>
</html>
